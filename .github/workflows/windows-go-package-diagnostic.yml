name: Windows Go package diagnostic

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Preflight run containing native and publication artifacts
        required: true
        type: string
      target:
        description: Windows package target to exercise
        required: true
        default: windows-aarch64-msvc
        type: choice
        options:
          - windows-aarch64-msvc
          - windows-x86_64-msvc

permissions:
  actions: read
  contents: read

jobs:
  go-package:
    runs-on: ${{ inputs.target == 'windows-aarch64-msvc' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: bindings-package-${{ inputs.target }}-native-jvm
          cache-workspace-crates: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.target == 'windows-aarch64-msvc' && 'arm64' || 'x64' }}
      - uses: actions/cache@v5
        if: inputs.target == 'windows-aarch64-msvc'
        with:
          path: ${{ runner.tool_cache }}/llvm-mingw-20260616-ucrt-aarch64
          key: llvm-mingw-20260616-ucrt-windows-aarch64
      - name: Install pinned Windows ARM64 LLVM-MinGW
        if: inputs.target == 'windows-aarch64-msvc'
        shell: pwsh
        run: .github/scripts/install-windows-arm64-llvm-mingw.ps1
      - name: Build package acceptance driver
        run: cargo build --locked --manifest-path rust/Cargo.toml -p revault_tooling
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: native-${{ inputs.target }}
          path: native
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: revault-api-publication-trees
          path: packages
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - name: Configure cgo compiler
        shell: pwsh
        run: |
          if ('${{ inputs.target }}' -eq 'windows-aarch64-msvc') {
            $compiler = Join-Path $env:REVAULT_LLVM_MINGW_ROOT 'bin\aarch64-w64-mingw32-clang.exe'
          } else {
            $compiler = 'C:\mingw64\bin\gcc.exe'
          }
          if (-not (Test-Path $compiler)) {
            throw "Windows cgo compiler is missing: $compiler"
          }
          "REVAULT_GO_CC=$compiler" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise the retained installed Go package
        shell: pwsh
        run: >-
          rust/target/debug/revault-tool.exe e2e package-conformance
          --language go
          --target "${{ inputs.target }}"
          --archive native
          --packages packages
          --repository .
          --work "package-conformance-go-${{ inputs.target }}"
