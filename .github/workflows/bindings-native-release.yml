name: bindings native release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v
        required: true
        type: string
      targets:
        description: Comma-separated publication targets to retry
        required: true
        default: python,ruby,git
        type: string
      publish:
        description: Publish after validation (disable for a pre-release matrix run)
        required: true
        default: true
        type: boolean
      promotion_run_id:
        description: Exact successful preflight run to promote on a publication retry
        required: false
        default: ''
        type: string
      promotion_source_sha:
        description: Source SHA recorded by the explicit preflight run
        required: false
        default: ''
        type: string
      diagnostic_run_id:
        description: Retained preflight run to use for a Windows Go-only diagnostic
        required: false
        default: ''
        type: string
      diagnostic_target:
        description: Windows target for a retained-package diagnostic
        required: false
        default: windows-aarch64-msvc
        type: choice
        options:
          - windows-aarch64-msvc
          - windows-x86_64-msvc
  push:
    tags:
      - revault-api-v*
      - revault-dart-v*

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  # Keep this non-hidden: upload-artifact excludes hidden paths by default.
  RELEASE_TOOL: packages/release-tools/revault-tool

jobs:
  package-matrix:
    name: define installed package combinations
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id == ''
    runs-on: ubuntu-24.04
    env:
      RELEASE_TARGETS: ${{ inputs.targets }}
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: bindings-tooling-linux-x86_64
          cache-workspace-crates: true
      - id: matrix
        shell: bash
        run: |
          value=$(cargo run --locked --quiet --manifest-path rust/Cargo.toml -p revault_tooling -- e2e matrix-json)
          if [[ "$GITHUB_REF_NAME" == revault-dart-v* ]]; then
            value=$(jq -c \
              '{include: [.include[] | select(.group == "managed-script") | .languages = "dart"]}' \
              <<< "$value")
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.publish }}" == true ]]; then
            value=$(jq -c --arg targets ",${RELEASE_TARGETS}," \
              '{include: [.include[]
                | .languages as $languages
                | .languages = ([$languages | split(",")[] as $language
                    | select($targets | contains("," + $language + ","))
                    | $language] | join(","))
                | select(.languages != "")]}' <<< "$value")
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  # A tag is a promotion event, not a second validation event. Locate the
  # successful, non-publishing workflow_dispatch run for this exact SHA and
  # release version; the next job carries its immutable outputs into this run.
  preflight-run:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
      source-sha: ${{ steps.find.outputs.source-sha }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Locate the matching successful preflight
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.promotion_source_sha != '' && inputs.promotion_source_sha || github.sha }}
          EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('revault-api-v{0}', inputs.version) }}
          REQUESTED_RUN_ID: ${{ inputs.promotion_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${EXPECTED_VERSION#revault-*-v}"
          expected_sha="$EXPECTED_SHA"
          if [[ "$GITHUB_REF_NAME" == revault-dart-v* ]]; then
            ref=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/revault-api-v$expected_version")
            tag_type=$(jq -r '.object.type' <<< "$ref")
            expected_sha=$(jq -r '.object.sha' <<< "$ref")
            if [[ "$tag_type" == tag ]]; then
              expected_sha=$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$expected_sha" --jq '.object.sha')
            fi
          fi
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            ref=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/revault-api-v$expected_version")
            tag_type=$(jq -r '.object.type' <<< "$ref")
            tag_object=$(jq -r '.object.sha' <<< "$ref")
            if [[ "$tag_type" == tag ]]; then
              tag_object=$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')
            fi
            test "$tag_object" = "$expected_sha" || {
              echo "Release tag resolves to $tag_object, not $expected_sha" >&2
              exit 1
            }
            run_ids="$REQUESTED_RUN_ID"
          else
            run_ids=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow bindings-native-release.yml \
              --event workflow_dispatch \
              --status success \
              --commit "$expected_sha" \
              --limit 20 \
              --json databaseId --jq '.[].databaseId')
          fi
          for run_id in $run_ids; do
            metadata=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
              --json conclusion,event,headSha)
            test "$(jq -r '.conclusion' <<< "$metadata")" = success || continue
            test "$(jq -r '.event' <<< "$metadata")" = workflow_dispatch || continue
            test "$(jq -r '.headSha' <<< "$metadata")" = "$expected_sha" || continue
            candidate="$RUNNER_TEMP/preflight-$run_id"
            rm -rf "$candidate"
            mkdir -p "$candidate"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name registry-publication-payloads --dir "$candidate"; then
              continue
            fi
            test "$(cat "$candidate/SOURCE_SHA")" = "$expected_sha" || continue
            test "$(cat "$candidate/SOURCE_VERSION")" = "$expected_version" || continue
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name revault-api-publication-trees --dir "$candidate/tree"; then
              continue
            fi
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
            echo "source-sha=$expected_sha" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "No successful preflight matched SHA $expected_sha and version $expected_version" >&2
          exit 1

  preflight-artifacts:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [preflight-run]
    runs-on: ubuntu-24.04
    outputs:
      source-sha: ${{ needs.preflight-run.outputs.source-sha }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight-run.outputs.run-id }}
          pattern: native-*
          path: native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight-run.outputs.run-id }}
          name: swift-macos-xcframework
          path: swift
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight-run.outputs.run-id }}
          name: revault-api-publication-trees
          path: packages
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight-run.outputs.run-id }}
          name: registry-publication-payloads
          path: registry
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight-run.outputs.run-id }}
          pattern: python-wheel-*
          path: python
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight-run.outputs.run-id }}
          pattern: lua-publication-*
          path: lua
          merge-multiple: true
      - uses: actions/upload-artifact@v7
        with:
          name: native-preflight
          path: native
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: swift-macos-xcframework
          path: swift
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: revault-api-publication-trees
          path: packages
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: registry-publication-payloads
          path: registry
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-preflight
          path: python
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: lua-publication-preflight
          path: lua
          if-no-files-found: error

  conformance:
    name: 16 installed Linux APIs and 480 interoperability paths
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: bindings-linux-conformance
          cache-workspace-crates: true
      - name: Run exhaustive package E2E matrix
        if: ${{ (github.event_name != 'workflow_dispatch' && !startsWith(github.ref_name, 'revault-dart-v')) || (github.event_name == 'workflow_dispatch' && !inputs.publish) }}
        working-directory: rust
        run: cargo run --locked -p revault_tooling -- e2e matrix --jobs 4 --compose ../bindings/e2e/compose.yaml
      - name: Keep Dart-only release scoped to Dart package conformance
        if: ${{ startsWith(github.ref_name, 'revault-dart-v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: echo "Publication targets are exercised from their assembled packages on the selected native targets."

  windows-go-diagnostic:
    name: retained Go package on ${{ inputs.diagnostic_target }}
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id != ''
    runs-on: ${{ inputs.diagnostic_target == 'windows-aarch64-msvc' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: bindings-package-${{ inputs.diagnostic_target }}-native-jvm
          cache-workspace-crates: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.diagnostic_target == 'windows-aarch64-msvc' && 'arm64' || 'x64' }}
      - uses: actions/cache@v5
        if: inputs.diagnostic_target == 'windows-aarch64-msvc'
        with:
          path: ${{ runner.tool_cache }}/llvm-mingw-20260616-ucrt-aarch64
          key: llvm-mingw-20260616-ucrt-windows-aarch64
      - name: Install pinned Windows ARM64 LLVM-MinGW
        if: inputs.diagnostic_target == 'windows-aarch64-msvc'
        shell: pwsh
        run: .github/scripts/install-windows-arm64-llvm-mingw.ps1
      - name: Build package acceptance driver
        run: cargo build --locked --manifest-path rust/Cargo.toml -p revault_tooling
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.diagnostic_run_id }}
          name: native-${{ inputs.diagnostic_target }}
          path: native
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.diagnostic_run_id }}
          name: revault-api-publication-trees
          path: packages
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - name: Configure cgo compiler
        shell: pwsh
        run: |
          if ('${{ inputs.diagnostic_target }}' -eq 'windows-aarch64-msvc') {
            $compiler = Join-Path $env:REVAULT_LLVM_MINGW_ROOT 'bin\aarch64-w64-mingw32-clang.exe'
          } else {
            $compiler = 'C:\mingw64\bin\gcc.exe'
          }
          if (-not (Test-Path $compiler)) {
            throw "Windows cgo compiler is missing: $compiler"
          }
          "REVAULT_GO_CC=$compiler" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise retained installed Go package
        shell: pwsh
        run: >-
          rust/target/debug/revault-tool.exe e2e package-conformance
          --language go
          --target "${{ inputs.diagnostic_target }}"
          --archive native
          --packages packages
          --repository .
          --work "package-conformance-go-${{ inputs.diagnostic_target }}"
      - name: Report Go executable dependencies after a runtime failure
        if: failure()
        shell: pwsh
        run: |
          $executable = Get-ChildItem `
            -Path "package-conformance-go-${{ inputs.diagnostic_target }}" `
            -Filter 'revault-go-conformance.exe' `
            -Recurse | Select-Object -First 1
          if (-not $executable) {
            Write-Error 'The Go conformance executable was not produced.'
            exit 0
          }
          Write-Host "Dependencies for $($executable.FullName):"
          dumpbin.exe /DEPENDENTS $executable.FullName
          Write-Host 'Recent Windows loader events:'
          Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            StartTime = (Get-Date).AddMinutes(-10)
          } -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Message -like '*revault-go-conformance*' -or
              $_.ProviderName -eq 'Application Error'
            } |
            Select-Object -First 10 TimeCreated, ProviderName, Id, Message |
            Format-List

  native:
    name: native ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-gnu
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            library: librevault_api.so
            static_library: librevault_api.a
            go_rust_target: ''
          - target: linux-aarch64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            library: librevault_api.so
            static_library: librevault_api.a
            go_rust_target: ''
          - target: macos-x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            library: librevault_api.dylib
            static_library: librevault_api.a
            go_rust_target: ''
          - target: macos-aarch64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            library: librevault_api.dylib
            static_library: librevault_api.a
            go_rust_target: ''
          - target: windows-x86_64-msvc
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            library: revault_api.dll
            static_library: revault_api.lib
            go_rust_target: x86_64-pc-windows-gnu
          - target: windows-aarch64-msvc
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            library: revault_api.dll
            static_library: revault_api.lib
            go_rust_target: aarch64-pc-windows-gnullvm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.go_rust_target != '' && format('{0},{1}', matrix.rust_target, matrix.go_rust_target) || matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: bindings-native-${{ matrix.rust_target }}
          cache-workspace-crates: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target == 'windows-aarch64-msvc' && 'arm64' || 'x64' }}
      - uses: actions/cache@v5
        if: matrix.target == 'windows-aarch64-msvc'
        with:
          path: ${{ runner.tool_cache }}/llvm-mingw-20260616-ucrt-aarch64
          key: llvm-mingw-20260616-ucrt-windows-aarch64
      - name: Install pinned Windows ARM64 LLVM-MinGW
        if: matrix.target == 'windows-aarch64-msvc'
        shell: pwsh
        run: .github/scripts/install-windows-arm64-llvm-mingw.ps1
      - name: Configure Windows native compilers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hostArch = $env:VSCMD_ARG_HOST_ARCH.ToLowerInvariant()
          $targetArch = $env:VSCMD_ARG_TGT_ARCH.ToLowerInvariant()
          $linker = Join-Path $env:VCToolsInstallDir "bin\Host$hostArch\$targetArch\link.exe"
          $clangCandidates = @(
            (Join-Path $env:VCINSTALLDIR "Tools\Llvm\$targetArch\bin\clang.exe"),
            (Join-Path $env:VCINSTALLDIR 'Tools\Llvm\bin\clang.exe')
          )
          $clang = $clangCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not (Test-Path $linker)) {
            throw "MSVC linker is missing: $linker"
          }
          if (-not $clang) {
            throw "Visual Studio clang is missing; checked: $($clangCandidates -join ', ')"
          }
          $msvcTarget = '${{ matrix.target == 'windows-aarch64-msvc' && 'AARCH64_PC_WINDOWS_MSVC' || 'X86_64_PC_WINDOWS_MSVC' }}'
          $msvcCc = '${{ matrix.target == 'windows-aarch64-msvc' && 'CC_aarch64_pc_windows_msvc' || 'CC_x86_64_pc_windows_msvc' }}'
          @(
            "CARGO_TARGET_${msvcTarget}_LINKER=$linker",
            "${msvcCc}=$clang"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ('${{ matrix.go_rust_target }}') {
            if ('${{ matrix.target }}' -eq 'windows-aarch64-msvc') {
              $goCompiler = Join-Path $env:REVAULT_LLVM_MINGW_ROOT 'bin\aarch64-w64-mingw32-clang.exe'
              $goTarget = 'AARCH64_PC_WINDOWS_GNULLVM'
              $goCc = 'CC_aarch64_pc_windows_gnullvm'
            } else {
              $goCompilerCandidates = @(
                'C:\mingw64\bin\gcc.exe',
                (Join-Path $env:ProgramFiles 'Git\mingw64\bin\gcc.exe')
              )
              $goCompiler = $goCompilerCandidates |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1
              if (-not $goCompiler) {
                throw "Windows x64 Go carrier compiler is missing; checked: $($goCompilerCandidates -join ', ')"
              }
              $goTarget = 'X86_64_PC_WINDOWS_GNU'
              $goCc = 'CC_x86_64_pc_windows_gnu'
            }
            if (-not (Test-Path $goCompiler)) {
              throw "Windows Go carrier compiler is missing: $goCompiler"
            }
            @(
              "CARGO_TARGET_${goTarget}_LINKER=$goCompiler",
              "${goCc}=$goCompiler"
            ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          dbus-x11 gnome-keyring libsecret-tools libdbus-1-dev
          pkg-config
      - name: Build release library
        working-directory: rust
        run: cargo build --locked --release --target ${{ matrix.rust_target }} -p revault_bindings
      - name: Build Windows Go static carrier
        if: matrix.go_rust_target != ''
        working-directory: rust
        run: >-
          cargo rustc --locked --release --target ${{ matrix.go_rust_target }}
          -p revault_bindings --lib -- --crate-type staticlib
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#revault-*-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Package native ABI
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-Clinker=lld-link.exe' || '' }}
        run: |
          go_static=()
          if [[ -n "${{ matrix.go_rust_target }}" ]]; then
            go_static=(
              --go-static-library
              "rust/target/${{ matrix.go_rust_target }}/release/librevault_api.a"
            )
          fi
          cargo run --locked --manifest-path rust/Cargo.toml -p revault_tooling -- release package-native \
            --repository . \
            --version "${{ steps.version.outputs.value }}" \
            --target "${{ matrix.target }}" \
            --library "rust/target/${{ matrix.rust_target }}/release/${{ matrix.library }}" \
            --static-library "rust/target/${{ matrix.rust_target }}/release/${{ matrix.static_library }}" \
            "${go_static[@]}" \
            --output dist
      - name: Install archive and run all 217 native operations
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-Clinker=lld-link.exe' || '' }}
        run: >-
          cargo run --locked --manifest-path rust/Cargo.toml -p revault_tooling --
          e2e native-conformance
          --archive "dist/revault-api-native-${{ steps.version.outputs.value }}-${{ matrix.target }}.${{ startsWith(matrix.target, 'windows-') && 'zip' || 'tar.gz' }}"
          --repository .
          --work native-conformance
      - name: Attest native archives
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos-xcframework:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id == ''
    needs: native
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-macos-*
          path: native
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build universal Swift binary target
        run: >-
          cargo run --locked --manifest-path rust/Cargo.toml -p revault_tooling --
          release package-xcframework
          --x86-64-archive native/native-macos-x86_64/revault-api-native-*-macos-x86_64.tar.gz
          --aarch64-archive native/native-macos-aarch64/revault-api-native-*-macos-aarch64.tar.gz
          --output dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/RevaultC.xcframework.zip
      - uses: actions/upload-artifact@v7
        with:
          name: swift-macos-xcframework
          path: dist/RevaultC.xcframework.zip*
          if-no-files-found: error

  package-conformance:
    name: ${{ matrix.group }} installed packages on ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id == ''
    needs: [package-matrix, native, ecosystem-layouts]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: bindings-package-${{ matrix.target }}-${{ matrix.group }}
          cache-workspace-crates: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target == 'windows-aarch64-msvc' && 'arm64' || 'x64' }}
      - uses: actions/cache@v5
        if: matrix.target == 'windows-aarch64-msvc' && contains(format(',{0},', matrix.languages), ',go,')
        with:
          path: ${{ runner.tool_cache }}/llvm-mingw-20260616-ucrt-aarch64
          key: llvm-mingw-20260616-ucrt-windows-aarch64
      - name: Install pinned Windows ARM64 LLVM-MinGW
        if: matrix.target == 'windows-aarch64-msvc' && contains(format(',{0},', matrix.languages), ',go,')
        shell: pwsh
        run: .github/scripts/install-windows-arm64-llvm-mingw.ps1
      - name: Build package acceptance driver before language setup
        run: cargo build --locked --manifest-path rust/Cargo.toml -p revault_tooling
      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.target }}
          path: native
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: actions/setup-node@v7
        if: contains(format(',{0},', matrix.languages), ',javascript,') || contains(format(',{0},', matrix.languages), ',typescript,') || contains(format(',{0},', matrix.languages), ',wasm,')
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        if: contains(format(',{0},', matrix.languages), ',python,')
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        if: contains(format(',{0},', matrix.languages), ',java,') || contains(format(',{0},', matrix.languages), ',kotlin,')
        with:
          distribution: temurin
          java-version: ${{ matrix.target == 'windows-aarch64-msvc' && '23' || '22' }}
      - uses: gradle/actions/setup-gradle@v4
        if: contains(format(',{0},', matrix.languages), ',java,') || contains(format(',{0},', matrix.languages), ',kotlin,')
        with:
          gradle-version: '8.13'
      - uses: actions/setup-dotnet@v6
        if: contains(format(',{0},', matrix.languages), ',csharp,')
        with:
          dotnet-version: '8.0.x'
      - uses: dart-lang/setup-dart@v1
        if: contains(format(',{0},', matrix.languages), ',dart,')
      - uses: actions/setup-go@v7
        if: contains(format(',{0},', matrix.languages), ',go,')
        with:
          go-version: '1.24.x'
          cache: false
      - name: Configure Windows MSVC consumers
        if: runner.os == 'Windows' && (contains(format(',{0},', matrix.languages), ',go,') || contains(format(',{0},', matrix.languages), ',rust,'))
        shell: pwsh
        run: |
          $hostArch = $env:VSCMD_ARG_HOST_ARCH.ToLowerInvariant()
          $targetArch = $env:VSCMD_ARG_TGT_ARCH.ToLowerInvariant()
          $linker = Join-Path $env:VCToolsInstallDir "bin\Host$hostArch\$targetArch\link.exe"
          $clangCandidates = @(
            (Join-Path $env:VCINSTALLDIR "Tools\Llvm\$targetArch\bin\clang.exe"),
            (Join-Path $env:VCINSTALLDIR 'Tools\Llvm\bin\clang.exe')
          )
          $clang = $clangCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not (Test-Path $linker)) {
            throw "MSVC linker is missing: $linker"
          }
          if (-not $clang) {
            throw "Visual Studio clang is missing; checked: $($clangCandidates -join ', ')"
          }
          $rustTarget = '${{ matrix.target == 'windows-aarch64-msvc' && 'AARCH64_PC_WINDOWS_MSVC' || 'X86_64_PC_WINDOWS_MSVC' }}'
          $rustCc = '${{ matrix.target == 'windows-aarch64-msvc' && 'CC_aarch64_pc_windows_msvc' || 'CC_x86_64_pc_windows_msvc' }}'
          if ('${{ matrix.target }}' -eq 'windows-aarch64-msvc') {
            $goCompiler = Join-Path $env:REVAULT_LLVM_MINGW_ROOT 'bin\aarch64-w64-mingw32-clang.exe'
            if (-not (Test-Path $goCompiler)) {
              throw "Windows ARM64 cgo compiler is missing: $goCompiler"
            }
          } else {
            $goCompilerCandidates = @(
              'C:\mingw64\bin\gcc.exe',
              (Join-Path $env:ProgramFiles 'Git\mingw64\bin\gcc.exe')
            )
            $goCompiler = $goCompilerCandidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
            if (-not $goCompiler) {
              throw "Windows x64 cgo compiler is missing; checked: $($goCompilerCandidates -join ', ')"
            }
          }
          @(
            "CARGO_TARGET_${rustTarget}_LINKER=$linker",
            "${rustCc}=$clang",
            "REVAULT_GO_CC=$goCompiler"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: ruby/setup-ruby@v1
        if: contains(format(',{0},', matrix.languages), ',ruby,')
        with:
          ruby-version: ${{ matrix.target == 'windows-aarch64-msvc' && '3.4' || '3.3' }}
      - uses: shivammathur/setup-php@v2
        if: contains(format(',{0},', matrix.languages), ',php,')
        with:
          php-version: '8.3'
          extensions: ffi
          tools: composer:v2
      - uses: leafo/gh-actions-lua@v13
        if: contains(format(',{0},', matrix.languages), ',lua,') && matrix.target != 'windows-aarch64-msvc'
        with:
          luaVersion: luajit-2.1
      - name: Build native Windows ARM64 LuaJIT
        if: contains(format(',{0},', matrix.languages), ',lua,') && matrix.target == 'windows-aarch64-msvc'
        shell: pwsh
        run: .github/scripts/install-windows-arm64-luajit.ps1
      - uses: leafo/gh-actions-luarocks@v5
        if: contains(format(',{0},', matrix.languages), ',lua,') && runner.os != 'Windows'
      - name: Install Windows LuaRocks
        if: contains(format(',{0},', matrix.languages), ',lua,') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'luarocks-3.11.1-windows-64.zip'
          $root = Join-Path $env:RUNNER_TEMP 'luarocks'
          Invoke-WebRequest `
            -Uri 'https://luarocks.github.io/luarocks/releases/luarocks-3.11.1-windows-64.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = 'c71dba3d03e12305e9ccd022c621c8869aba3d124d9249e214aed5c16f3682a3'
          if ($actual -ne $expected) {
            throw "LuaRocks archive checksum mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $root
          $bin = Join-Path $root 'luarocks-3.11.1-windows-64'
          $luarocks = Join-Path $bin 'luarocks.exe'
          $lua = (Get-Command lua.exe).Source
          & $luarocks --lua-version 5.1 config variables.LUA $lua
          $bin |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux service and build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake dbus-x11 gnome-keyring libsecret-tools libdbus-1-3 libdbus-1-dev pkg-config
      - name: Install, unpack and exercise every claimed package in the group
        shell: bash
        env:
          PACKAGE_LANGUAGES: ${{ matrix.languages }}
          PACKAGE_TARGET: ${{ matrix.target }}
          CONFORMANCE_TOOL: ${{ runner.os == 'Windows' && 'rust/target/debug/revault-tool.exe' || 'rust/target/debug/revault-tool' }}
          PACKAGE_CONFORMANCE_JOBS: 2
        run: |
          failures=()
          pids=()
          running_languages=()
          logs=()

          run_language() {
            local language=$1
            local runtime_dir="$RUNNER_TEMP/revault-runtime-$language-$PACKAGE_TARGET"
            mkdir -p "$runtime_dir"
            XDG_RUNTIME_DIR="$runtime_dir" "$CONFORMANCE_TOOL" e2e package-conformance \
              --language "$language" \
              --target "$PACKAGE_TARGET" \
              --archive native \
              --packages packages \
              --repository . \
              --work "package-conformance-$language-$PACKAGE_TARGET"
          }

          finish_batch() {
            for index in "${!pids[@]}"; do
              language=${running_languages[$index]}
              if wait "${pids[$index]}"; then
                status=0
              else
                status=$?
              fi
              echo "::group::$language installed package on $PACKAGE_TARGET"
              cat "${logs[$index]}"
              echo "::endgroup::"
              if (( status != 0 )); then
                failures+=("$language")
              fi
            done
            pids=()
            running_languages=()
            logs=()
          }

          IFS=',' read -ra languages <<< "$PACKAGE_LANGUAGES"
          for language in "${languages[@]}"; do
            log="$RUNNER_TEMP/package-conformance-$language-$PACKAGE_TARGET.log"
            run_language "$language" >"$log" 2>&1 &
            pids+=("$!")
            running_languages+=("$language")
            logs+=("$log")
            if (( ${#pids[@]} == PACKAGE_CONFORMANCE_JOBS )); then
              finish_batch
            fi
          done
          if (( ${#pids[@]} != 0 )); then
            finish_batch
          fi
          if (( ${#failures[@]} != 0 )); then
            echo "Failed installed packages: ${failures[*]}" >&2
            exit 1
          fi

  github-release:
    if: >-
      always() &&
      inputs.diagnostic_run_id == '' &&
      (startsWith(github.ref_name, 'revault-api-v') ||
       startsWith(github.ref_name, 'revault-dart-v') ||
       github.event_name == 'workflow_dispatch') &&
      ((github.event_name == 'workflow_dispatch' && !inputs.publish) ||
       needs.preflight-artifacts.result == 'success')
    needs: [native, macos-xcframework, ecosystem-layouts, conformance, package-conformance, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        if: startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          name: swift-macos-xcframework
          path: dist
      - name: Publish immutable native archives
        if: startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('revault-api-v{0}', inputs.version) }}
          generate_release_notes: true
          files: dist/*
      - name: Verify immutable release for publication retry
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'revault-dart-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          if gh release view "revault-api-v$version" --repo onepub-dev/reVault; then
            echo "Using existing immutable GitHub release for publication retry."
          elif [[ "$GITHUB_REF_NAME" == revault-dart-v* ]]; then
            echo "The immutable revault-api-v$version release is required for Dart promotion." >&2
            exit 1
          else
            echo "No immutable GitHub release exists; continuing with registry-only publication."
          fi

  ecosystem-layouts:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id == ''
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: bindings-tooling-linux-x86_64
          cache-workspace-crates: true
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#revault-*-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage registry-native layouts
        run: >-
          cargo run --locked --manifest-path rust/Cargo.toml -p revault_tooling --
          release stage-ecosystems --repository .
          --version "${{ steps.version.outputs.value }}"
          --output ecosystem
          native/revault-api-native-*.tar.gz
          native/revault-api-native-*.zip
      - name: Assemble complete registry packages
        run: >-
          cargo run --locked --manifest-path rust/Cargo.toml -p revault_tooling --
          release assemble-packages
          --version "${{ steps.version.outputs.value }}"
          --layout ecosystem
          --source .
          --output packages
      - name: Stage the exact-commit publication driver
        run: |
          mkdir -p packages/release-tools
          install -m 0755 rust/target/debug/revault-tool "$RELEASE_TOOL"
      - name: Verify all Dart native carriers are in the publication tree
        shell: bash
        run: |
          set -euo pipefail
          declare -A libraries=(
            [linux-x86_64-gnu]=librevault_api.so
            [linux-aarch64-gnu]=librevault_api.so
            [macos-x86_64]=librevault_api.dylib
            [macos-aarch64]=librevault_api.dylib
            [windows-x86_64-msvc]=revault_api.dll
            [windows-aarch64-msvc]=revault_api.dll
          )
          for target in "${!libraries[@]}"; do
            carrier="packages/dart/lib/src/native/$target/${libraries[$target]}"
            test -f "$carrier" || {
              echo "Missing Dart native carrier: $carrier" >&2
              exit 1
            }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ecosystem-native-layouts
          path: ecosystem
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: revault-api-publication-trees
          path: packages
          if-no-files-found: error

  # Freeze registry payloads alongside installed-package conformance. They are
  # eligible for promotion only when the complete preflight run succeeds, so
  # parallel packing shortens the critical path without bypassing a gate.
  publication-artifacts:
    name: freeze registry publication payloads
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id == ''
    needs: [ecosystem-layouts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Pack npm, NuGet, and Ruby payloads once
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          mkdir -p artifacts/npm-native artifacts/npm artifacts/nuget artifacts/ruby
          for package in packages/npm/revault-api-native-*; do
            npm pack "$package" --pack-destination artifacts/npm-native
          done
          npm pack packages/npm/revault-api --pack-destination artifacts/npm
          npm pack packages/npm/revault-api-wasm --pack-destination artifacts/npm
          facade=$(find artifacts/npm -type f -name '*revault-api-[0-9]*.tgz' -print -quit)
          wasm=$(find artifacts/npm -type f -name '*revault-api-wasm-[0-9]*.tgz' -print -quit)
          test -n "$facade" && mv "$facade" artifacts/npm/revault-api.tgz
          test -n "$wasm" && mv "$wasm" artifacts/npm/revault-api-wasm.tgz
          dotnet pack packages/nuget/RevaultBindings.csproj -c Release -o artifacts/nuget --nologo
          for root in packages/ruby/*; do
            target=$(basename "$root")
            gem build "$root/revault_api.gemspec" \
              --output "artifacts/ruby/revault_api-${version}-${target}.gem"
          done
          sha256sum artifacts/npm-native/* artifacts/npm/* artifacts/nuget/* artifacts/ruby/* \
            > artifacts/SHA256SUMS
          git rev-parse HEAD > artifacts/SOURCE_SHA
          printf '%s\n' "$version" > artifacts/SOURCE_VERSION
          install -m 0755 packages/release-tools/revault-tool artifacts/revault-tool
      - uses: actions/upload-artifact@v7
        with:
          name: registry-publication-payloads
          path: artifacts
          if-no-files-found: error

  publish-npm-native:
    if: always() && needs.github-release.result == 'success' && needs.preflight-artifacts.result == 'success' && (startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'npm')))
    needs: [github-release, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_TOOL: artifacts/revault-tool
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: registry-publication-payloads
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - name: Verify and publish the frozen native carrier packages first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test "$(cat artifacts/SOURCE_SHA)" = "${{ needs.preflight-artifacts.outputs.source-sha }}"
          sha256sum --check artifacts/SHA256SUMS
          chmod +x "$RELEASE_TOOL"
          "$RELEASE_TOOL" release publish \
            --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}" \
            --packages packages --ecosystem npm-native --prebuilt artifacts --publish

  publish-npm:
    if: always() && needs.publish-npm-native.result == 'success' && needs.preflight-artifacts.result == 'success' && (startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'npm')))
    needs: [publish-npm-native, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_TOOL: artifacts/revault-tool
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: registry-publication-payloads
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - name: Verify and publish the frozen JavaScript and TypeScript facade
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test "$(cat artifacts/SOURCE_SHA)" = "${{ needs.preflight-artifacts.outputs.source-sha }}"
          sha256sum --check artifacts/SHA256SUMS
          chmod +x "$RELEASE_TOOL"
          "$RELEASE_TOOL" release publish \
            --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}" \
            --packages packages --ecosystem npm --prebuilt artifacts --publish
      - name: Publish the frozen hosted WebAssembly package last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          "$RELEASE_TOOL" release publish \
            --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}" \
            --packages packages --ecosystem wasm --prebuilt artifacts --publish

  build-python-wheels:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id == ''
    needs: [ecosystem-layouts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64-gnu, runner: ubuntu-24.04, architecture: x64 }
          - { target: linux-aarch64-gnu, runner: ubuntu-24.04-arm, architecture: arm64 }
          - { target: macos-x86_64, runner: macos-15-intel, architecture: x64 }
          - { target: macos-aarch64, runner: macos-15, architecture: arm64 }
          - { target: windows-x86_64-msvc, runner: windows-2025, architecture: x64 }
          - { target: windows-aarch64-msvc, runner: windows-11-arm, architecture: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Update Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Linux wheel repair tooling
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libdbus-1-3 patchelf
      - name: Install auditwheel
        if: runner.os == 'Linux'
        run: python -m pip install auditwheel
      - run: python -m pip install build twine
      - name: Build and verify platform wheel
        shell: bash
        run: >-
          cargo run --locked --manifest-path rust/Cargo.toml -p revault_tooling --
          release publish --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          --packages packages --ecosystem python --target "${{ matrix.target }}" --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/python/*.whl
          if-no-files-found: error

  publish-python:
    if: startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'python'))
    needs: [preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-maven:
    if: always() && needs.github-release.result == 'success' && needs.preflight-artifacts.result == 'success' && (startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'maven')))
    needs: [github-release, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - run: chmod +x "$RELEASE_TOOL"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Publish Java
        run: >-
          "$RELEASE_TOOL"
          release publish --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          --packages packages --ecosystem maven-java --publish
      - name: Make Java immediately available to the Kotlin build
        run: gradle -p packages/maven/java --no-daemon publishToMavenLocal
      - name: Publish Kotlin
        run: >-
          "$RELEASE_TOOL"
          release publish --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          --packages packages --ecosystem maven-kotlin --publish

  publish-nuget:
    if: always() && needs.github-release.result == 'success' && needs.preflight-artifacts.result == 'success' && (startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'nuget')))
    needs: [github-release, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_TOOL: artifacts/revault-tool
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: registry-publication-payloads
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Verify and publish the frozen NuGet package
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          test "$(cat artifacts/SOURCE_SHA)" = "${{ needs.preflight-artifacts.outputs.source-sha }}"
          sha256sum --check artifacts/SHA256SUMS
          chmod +x "$RELEASE_TOOL"
          "$RELEASE_TOOL" release publish \
            --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}" \
            --packages packages --ecosystem nuget --prebuilt artifacts --publish

  publish-dart:
    if: always() && needs.github-release.result == 'success' && needs.preflight-artifacts.result == 'success' && (startsWith(github.ref_name, 'revault-api-v') || startsWith(github.ref_name, 'revault-dart-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'dart')))
    needs: [github-release, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - run: chmod +x "$RELEASE_TOOL"
      - uses: dart-lang/setup-dart@v1
      - name: Publish pub.dev package
        run: >-
          "$RELEASE_TOOL"
          release publish --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          --packages packages --ecosystem dart --publish

  publish-ruby:
    if: always() && needs.github-release.result == 'success' && needs.preflight-artifacts.result == 'success' && (startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'ruby')))
    needs: [github-release, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_TOOL: artifacts/revault-tool
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: registry-publication-payloads
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Verify and publish all frozen platform gems
        run: |
          set -euo pipefail
          test "$(cat artifacts/SOURCE_SHA)" = "${{ needs.preflight-artifacts.outputs.source-sha }}"
          sha256sum --check artifacts/SHA256SUMS
          chmod +x "$RELEASE_TOOL"
          "$RELEASE_TOOL" release publish \
            --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}" \
            --packages packages --ecosystem ruby --prebuilt artifacts --publish

  build-lua-rocks:
    if: (github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.diagnostic_run_id == '') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'lua'))
    needs: [ecosystem-layouts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: luajit-2.1
      - uses: leafo/gh-actions-luarocks@v5
      - name: Pack all frozen platform binary rocks
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          chmod +x "$RELEASE_TOOL"
          "$RELEASE_TOOL" \
            release publish --version "$version" \
            --packages packages --ecosystem lua --output dist
          cp "packages/lua/linux-x86_64-gnu/revault_api-${version}-1.rockspec" dist/lua/
      - uses: actions/upload-artifact@v7
        with:
          name: lua-publication-all-targets
          path: dist/lua
          if-no-files-found: error

  publish-lua:
    if: startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'lua'))
    needs: [preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: actions/download-artifact@v8
        with:
          pattern: lua-publication-*
          path: artifacts/lua
          merge-multiple: true
      - name: Publish the frozen LuaRocks payloads
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x packages/release-tools/revault-tool
          packages/release-tools/revault-tool release publish \
            --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}" \
            --packages packages --ecosystem lua --prebuilt artifacts --publish

  publish-rust:
    if: always() && needs.github-release.result == 'success' && needs.preflight-artifacts.result == 'success' && (startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'rust')))
    needs: [github-release, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TOOL: ${{ github.event_name == 'workflow_dispatch' && 'rust/target/release/revault-tool' || 'packages/release-tools/revault-tool' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: dtolnay/rust-toolchain@1.88.0
        if: github.event_name == 'workflow_dispatch'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          workspaces: rust
          shared-key: bindings-tooling-linux-x86_64
          cache-workspace-crates: true
      - name: Build the corrected publication driver for a retry
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p revault_tooling
      - name: Install native dependencies for Cargo's package verification
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: chmod +x "$RELEASE_TOOL"
      - id: crates
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish page, lockbox, and vault APIs in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: >-
          "$RELEASE_TOOL"
          release publish --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          --packages packages --ecosystem rust-foundation --publish
      - name: Publish crates.io facade
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: >-
          "$RELEASE_TOOL"
          release publish --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          --packages packages --ecosystem rust --publish

  promote-api-repository:
    if: always() && needs.github-release.result == 'success' && needs.preflight-artifacts.result == 'success' && (startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'git')))
    needs: [github-release, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: onepub-dev/revault-api
          token: ${{ secrets.REVAULT_BINDING_APIS_RELEASE_TOKEN }}
          path: destination
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - run: chmod +x "$RELEASE_TOOL"
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: swift-macos-xcframework
          path: release-assets
      - name: Promote combined Go, Swift, and PHP package tag
        run: >-
          "$RELEASE_TOOL"
          release promote-git --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          --packages packages --destination destination --package api
          --release-assets release-assets --publish

  promote-homebrew:
    if: always() && needs.github-release.result == 'success' && needs.preflight-artifacts.result == 'success' && (startsWith(github.ref_name, 'revault-api-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && contains(inputs.targets, 'git')))
    needs: [github-release, preflight-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: onepub-dev/revault-homebrew
          token: ${{ secrets.REVAULT_BINDING_APIS_RELEASE_TOKEN }}
          path: destination
      - uses: actions/download-artifact@v8
        with:
          name: revault-api-publication-trees
          path: packages
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: swift-macos-xcframework
          path: release-assets
      - run: chmod +x "$RELEASE_TOOL"
      - name: Generate checksummed package metadata and promote tag
        run: >-
          "$RELEASE_TOOL"
          release promote-git --version "${RELEASE_VERSION:-${GITHUB_REF_NAME#revault-*-v}}"
          --packages packages --destination destination --package homebrew
          --release-assets release-assets --publish
