name: Rust

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TEST_NOCAPTURE: "1"

on:
  workflow_call:
    inputs:
      package-api-coverage:
        description: Release package validation runs the public lockbox and vault integration suites on every desktop target
        type: boolean
        default: false
  push:
    # Defining a branch filter prevents immutable release-tag pushes from
    # rerunning source validation that the release preflight already accepted.
    branches-ignore:
      - "release-candidates/**"
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-msrv:
    name: Public APIs / Rust 1.88
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: api-msrv-1.88

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check public APIs at MSRV
        run: >-
          cargo check
          -p "$(cargo pkgid --manifest-path revault_page_api/Cargo.toml)"
          -p "$(cargo pkgid --manifest-path revault_lockbox_api/Cargo.toml)"
          -p "$(cargo pkgid --manifest-path revault_vault_api/Cargo.toml)"
          --all-targets
          --locked

      - name: Check published Rust binding at MSRV
        run: cargo check --manifest-path ../bindings/rust/Cargo.toml

  tooling-msrv:
    name: Tooling / Rust 1.88
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: msrv-1.88

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets --locked

  linux-quality:
    name: Linux formatting and Clippy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: linux-quality

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check required-package formatting
        run: >-
          cargo fmt
          -p revault_page_api
          -p revault_lockbox_api
          -p revault_cli
          -p revault_vault_api
          -p revault_migration_format
          -p revault_migrate_vault_v1
          -p revault_migrate_vault_v2
          -p revault_migrate_archive_v1
          -p revault_migration
          -p revault_publish_protocol
          -p revault_key_server
          -p xtask
          --check

      - name: Clippy production workspace
        run: >-
          cargo clippy --workspace --all-targets
          --exclude revault_bindings
          --exclude revault_wasm_bindings
          --exclude revault_tooling
          -- -D warnings

  linux-tests:
    name: Linux tests / ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: secure APIs
            cache: secure-apis
            command: |
              cargo test --locked -p "$(cargo pkgid --manifest-path revault_page_api/Cargo.toml)"
              test_api revault_lockbox_api public_api_suite
          # CLI suites run once in cli-e2e, including command coverage enforcement.
          - group: migrations
            cache: migrations
            command: |
              test_api revault_vault_api vault_api
              cargo test --locked \
              -p "$(cargo pkgid --manifest-path revault_migration_format/Cargo.toml)" \
              -p revault_migrate_vault_v1 \
              -p revault_migrate_vault_v2 \
              -p revault_migrate_archive_v1 \
              -p revault_migration
          - group: services and tooling
            cache: services-tooling
            command: >-
              cargo test --locked
              -p revault_publish_protocol
              -p revault_key_server
              -p revault_tooling
              -p xtask

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: linux-tests-${{ matrix.cache }}

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run required package tests
        env:
          PACKAGE_API_COVERAGE: ${{ inputs.package-api-coverage || false }}
        run: |
          # Discover targets so new integration suites remain covered automatically.
          test_api() {
            local package="$1" covered_suite="$2" package_id
            package_id=$(cargo pkgid --manifest-path "$package/Cargo.toml")
            if [[ "$PACKAGE_API_COVERAGE" != true ]]; then
              cargo test --locked -p "$package_id"
              return
            fi
            cargo test --locked -p "$package_id" --lib --bins --examples
            cargo test --locked -p "$package_id" --doc
            cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/api-targets.json"
            while IFS= read -r suite; do
              cargo test --locked -p "$package_id" --test "$suite"
            done < <(jq -r --arg package "$package" --arg covered "$covered_suite" \
              '.packages[] | select(.name == $package) | .targets[] | select(.kind | index("test")) | .name | select(. != $covered)' \
              "$RUNNER_TEMP/api-targets.json")
          }
          ${{ matrix.command }}

  platform:
    name: platform ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: platform-${{ matrix.os }}

      - name: Compile production workspace for this platform
        run: >-
          cargo check --workspace --all-targets --locked
          --exclude revault_bindings
          --exclude revault_wasm_bindings
          --exclude revault_tooling

      - name: Test platform-sensitive APIs
        run: |
          cargo test --locked -p revault_page_api
          cargo test --locked -p revault_vault_api --lib

      # The installed Rust package gate runs the complete vault_api suite on
      # both macOS architectures and both Windows architectures during release.
      - name: Test standalone vault integration
        if: ${{ !inputs.package-api-coverage }}
        run: |
          cargo test --locked -p revault_vault_api --test vault_api standalone_vault_file_can_be_created_and_reopened -- --exact
          cargo test --locked -p revault_vault_api --test vault_api vault_mutation_times_out

      - name: Test platform-specific lockbox filesystem behavior
        run: |
          cargo test --locked -p revault_lockbox_api file_lock
          cargo test --locked -p revault_lockbox_api extract_to_directory
          cargo test --locked -p revault_lockbox_api symlink
          cargo test --locked -p revault_lockbox_api create_path
          cargo test --locked -p revault_lockbox_api packed_page_relocation_updates_the_survivor_page_length

      - name: Agent IPC smoke test
        run: cargo test -p revault_cli --test agent_flow -- --nocapture

  cli-e2e:
    name: CLI E2E / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            cache: linux-x86_64
            command: cargo xtask test-cli-e2e
          # Exhaustive command/option coverage belongs to Linux. Keep Windows
          # lifecycles that exercise OS paths, locks, replacement and processes.
          # Non-ignored agent_flow tests already run in the platform job.
          - name: Windows x86_64 / filesystem lifecycles
            os: windows-latest
            cache: windows-x86_64-filesystem
            command: >-
              cargo test --locked -p revault_cli --test cli_flow --
              --exact --test-threads=1
              vault_lockbox_move_updates_file_vault_and_default_session
              plain_filesystem_move_reports_stale_session_default_clearly
              add_can_default_destination_and_list_recursively
              recover_reports_and_writes_recovered_lockbox
              remove_requires_confirmation_and_reports_count
              access_subcommands_manage_lockbox_access
          - name: Windows x86_64 / session and credentials
            os: windows-latest
            cache: windows-x86_64-session
            command: >-
              cargo test --locked -p revault_cli --test cli_flow --
              --exact --test-threads=1
              session_and_close_report_empty_cache_and_already_closed_state
              session_default_lockbox_applies_to_lockbox_argument_variants
              auto_open_lockboxes_uses_remembered_password
              auto_open_scope_commands_persist_without_a_platform_secret_store
              vault_passphrase_changes_password_and_creates_backup
              vault_backup_and_restore_round_trip_encrypted_vault
          - name: Windows x86_64 / mirror and migration
            os: windows-latest
            cache: windows-x86_64-mirror-migration
            command: >-
              cargo test --locked -p revault_cli --test mirror_cli -- --exact --test-threads=1
              mirror_create_rules_status_update_and_ownership
              mirror_excludes_the_lockbox_and_its_active_lock_file_from_its_source &&
              cargo test --locked -p revault_cli --test migration_cli -- --exact --test-threads=1
              vault_migration_commands_and_options_execute_end_to_end
              archive_migration_commands_and_options_execute_end_to_end
          - name: Windows x86_64 / completion and agent session
            os: windows-latest
            cache: windows-x86_64-completion-agent
            command: >-
              cargo test --locked -p revault_cli --test completion -- --test-threads=1 &&
              cargo test --locked -p revault_cli --test agent_flow
              open_and_open_key_complete_real_session_flows -- --ignored --exact --test-threads=1

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: cli-e2e-${{ matrix.cache }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run realistic CLI E2E contract
        run: ${{ matrix.command }}

  fuzz-harnesses:
    if: github.workflow != 'Release candidate'
    name: compile fuzz harnesses
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: fuzz-harnesses

      - name: Compile fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

  portable-core:
    name: core ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
          - os: ubuntu-latest
            target: wasm32-wasip2
          - os: macos-latest
            target: aarch64-apple-ios

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: portable-core-${{ matrix.target }}

      - name: Check core
        run: cargo check -p revault_lockbox_api --target ${{ matrix.target }}

      - name: Check secure tests
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo check -p revault_page_api --target ${{ matrix.target }} --tests

      - name: Check secure web library
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check -p revault_page_api --target ${{ matrix.target }} --lib

  network-integration:
    name: network integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: network-integration

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # CLI publish integration runs in cli-e2e and contributes command coverage.
      - name: Run ignored key-server network tests
        run: |
          cargo test --locked --manifest-path revault_key_server/Cargo.toml --test e2e_failover -- --ignored --nocapture --skip heavy_failover_recovery_under_load
          cargo test --locked --manifest-path revault_key_server/Cargo.toml --test protocol_store -- --ignored --nocapture --skip store_replays_large_persistent_store
