name: Rust

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LOCKBOX_COMPRESSION_CORPUS_VERSION: v1

on:
  push:
    # Defining a branch filter prevents immutable release-tag pushes from
    # rerunning source validation that the release preflight already accepted.
    branches:
      - "**"
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-msrv:
    name: Public APIs / Rust 1.88
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: api-msrv-1.88

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check public APIs at MSRV
        run: >-
          cargo check
          -p revault_page_api@0.0.4
          -p revault_lockbox_api@0.0.6
          -p revault_vault_api@0.0.6
          --all-targets
          --locked

      - name: Check published Rust binding at MSRV
        run: cargo check --manifest-path ../bindings/rust/Cargo.toml

  tooling-msrv:
    name: Tooling / Rust 1.88
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: msrv-1.88

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets --locked

  linux-quality:
    name: Linux formatting and Clippy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: linux-quality

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check required-package formatting
        run: >-
          cargo fmt
          -p revault_page_api
          -p revault_lockbox_api
          -p revault_cli
          -p revault_vault_api
          -p revault_migration_format
          -p revault_migrate_vault_v1
          -p revault_migrate_archive_v1
          -p revault_migration
          -p revault_publish_protocol
          -p revault_key_server
          -p xtask
          --check

      - name: Clippy production workspace
        run: >-
          cargo clippy --workspace --all-targets
          --exclude revault_bindings
          --exclude revault_wasm_bindings
          --exclude revault_tooling
          -- -D warnings

  linux-tests:
    name: Linux tests / ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: secure APIs
            cache: secure-apis
            packages: >-
              -p revault_page_api@0.0.4
              -p revault_lockbox_api@0.0.6
          - group: CLI and vault
            cache: cli-vault
            packages: >-
              -p revault_cli
              -p revault_vault_api@0.0.6
          - group: migrations
            cache: migrations
            packages: >-
              -p revault_migration_format
              -p revault_migrate_vault_v1
              -p revault_migrate_archive_v1
              -p revault_migration
          - group: services and tooling
            cache: services-tooling
            packages: >-
              -p revault_publish_protocol
              -p revault_key_server
              -p xtask

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: linux-tests-${{ matrix.cache }}

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run required package tests
        run: cargo test --locked ${{ matrix.packages }}

  platform:
    name: platform ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: platform-${{ matrix.os }}

      - name: Compile production workspace for this platform
        run: >-
          cargo check --workspace --all-targets --locked
          --exclude revault_bindings
          --exclude revault_wasm_bindings
          --exclude revault_tooling

      - name: Test platform-sensitive APIs
        run: |
          cargo test --locked -p revault_page_api
          cargo test --locked -p revault_vault_api --lib
          cargo test --locked -p revault_vault_api --test vault_api standalone_vault_file_can_be_created_and_reopened -- --exact
          cargo test --locked -p revault_vault_api --test vault_api vault_mutation_times_out

      - name: Test platform-specific lockbox filesystem behavior
        run: |
          cargo test --locked -p revault_lockbox_api file_lock
          cargo test --locked -p revault_lockbox_api extract_to_directory
          cargo test --locked -p revault_lockbox_api symlink
          cargo test --locked -p revault_lockbox_api create_path

      - name: Agent IPC smoke test
        run: cargo test -p revault_cli --test agent_flow -- --nocapture

      - name: Windows CLI smoke tests
        if: runner.os == 'Windows'
        run: >-
          cargo test --manifest-path revault_cli/Cargo.toml
          --test contact_receive_alias
          --test help_open_key
          --test publish_integration

  fuzz-harnesses:
    name: compile fuzz harnesses
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: fuzz-harnesses

      - name: Compile fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

  portable-core:
    name: core ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
          - os: ubuntu-latest
            target: wasm32-wasip2
          - os: macos-latest
            target: aarch64-apple-ios

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: portable-core-${{ matrix.target }}

      - name: Check core
        run: cargo check -p revault_lockbox_api --target ${{ matrix.target }}

      - name: Check secure tests
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo check -p revault_page_api --target ${{ matrix.target }} --tests

      - name: Check secure web library
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check -p revault_page_api --target ${{ matrix.target }} --lib

  compression-regression:
    name: compression regression corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore compression corpus
        id: compression-corpus-cache
        uses: actions/cache@v4
        with:
          path: rust/.ci-compression-corpus
          key: lockbox-compression-corpus-${{ env.LOCKBOX_COMPRESSION_CORPUS_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: compression-regression

      - name: Generate compression corpus
        if: steps.compression-corpus-cache.outputs.cache-hit != 'true'
        run: cargo bench -p revault_lockbox_api --bench compression_corpus -- .ci-compression-corpus

      - name: Run compression regression corpus
        env:
          LOCKBOX_COMPRESSION_CORPUS_DIR: ${{ github.workspace }}/rust/.ci-compression-corpus
        run: cargo test --release -p revault_lockbox_api compression_regression_tests -- --ignored --nocapture

  network-integration:
    name: network integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: network-integration

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run ignored network tests
        run: cargo xtask run-network-tests
