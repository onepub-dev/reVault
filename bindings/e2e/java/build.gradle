plugins {
    id 'application'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation "dev.onepub:revault-api:${providers.gradleProperty('revaultVersion').getOrElse('0.2.0')}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
            providers.gradleProperty('javaToolchain').getOrElse('22').toInteger()
        )
    }
}

sourceSets.main.java.srcDirs = [projectDir]
application {
    mainClass = 'com.onepub.revault.e2e.Conformance'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}
