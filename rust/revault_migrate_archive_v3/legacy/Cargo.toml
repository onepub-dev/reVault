[package]
readme = "README.md"
publish = false
name = "revault_archive_v3_reader"
version = "0.0.8"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "Deprecated: use revault_migrate_v3 for isolated historical migration"
repository = "https://github.com/onepub-dev/reVault"
documentation = "https://docs.rs/revault_lockbox_api"

[lib]
name = "revault_lockbox_api"
path = "src/lib.rs"
test = false
doctest = false

[features]
default = ["issue303-protocol"]
vault-integration = []
bindings = []
migration = []
test-support = []
# Compatibility feature name: format-v2 is unconditional in the core.
issue303-protocol = []

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
revault_page_api = { version = "0.0.41", path = "../../revault_page_api" }
ml-dsa = { version = "0.1", features = ["getrandom", "zeroize"] }
ml-kem = { version = "0.3.2", features = ["getrandom"] }
sha2 = { version = "0.11", features = ["zeroize"] }
serde_json = "1"
unicode-normalization = "0.1"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1.9"
zstd-complete = { version = "0.3.0", features = ["c-port-validation"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
criterion = "0.8.2"
oxiarc-zstd = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }
