[package]
name = "revault_migrate_vault_v2"
version = "0.0.25"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "Historical vault-structure-v2 exporter for reVault migrations"
repository = "https://github.com/onepub-dev/reVault"
readme = "README.md"

[[bin]]
name = "revault-migrate-vault-v2"
path = "src/bin/revault-migrate-vault-v2.rs"

[dependencies]
getrandom = "0.4"
revault_migration_format = "=0.0.4"
revault_vault_api_v2 = { package = "revault_vault_api", version = "=0.0.10" }
revault_lockbox_api_v2 = { package = "revault_lockbox_api", version = "=0.0.9" }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
