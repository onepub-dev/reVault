[package]
name = "revault_publish_protocol"
version = "0.0.5"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "reVault key server wire protocol and client API"
repository = "https://github.com/onepub-dev/reVault"
documentation = "https://docs.rs/revault_publish_protocol"
readme = "README.md"

[lib]
name = "revault_publish_protocol"
path = "src/lib.rs"

[features]
default = ["http"]
http = ["dep:httparse", "dep:ureq", "dep:url"]

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
revault_lockbox_api = { version = "0.0.9", path = "../revault_lockbox_api" }
httparse = { version = "1", optional = true }
sha2 = "0.11"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"], optional = true }
url = { version = "2", optional = true }
