[package]
name = "revault_migrate_archive_v4"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "Isolated authoritative-state exporter for lockbox format v4"
repository = "https://github.com/onepub-dev/reVault"

[dependencies]
revault_vault_api = { package = "revault_vault_v4_reader", version = "=0.0.1", path = "legacy_vault" }
revault_lockbox_api = { package = "revault_archive_v4_reader", version = "=0.0.1", path = "legacy", features = ["migration", "vault-integration"] }
revault_migration_format = { version = "0.0.35", path = "../revault_migration_format" }
getrandom = "0.4"
sha2 = "0.11"
zeroize = "1.9"
tempfile = "3"

[dev-dependencies]
serde_json = "1"
