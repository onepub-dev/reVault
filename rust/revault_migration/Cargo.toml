[package]
name = "revault_migration"
version = "0.0.46"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "Encrypted streaming migration artifacts for reVault vaults and archives"
repository = "https://github.com/onepub-dev/reVault"
readme = "README.md"
# Permanent release regression artifacts are retained in Git, not shipped to library consumers.
exclude = ["tests/retained/**", "tests/retained_fixtures.rs"]

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zeroize = "1.9"
revault_migration_format = { version = "0.0.42", path = "../revault_migration_format" }
revault_lockbox_api = { version = "0.0.48", path = "../revault_lockbox_api", features = ["migration", "issue303-protocol"] }
revault_vault_api = { version = "0.0.49", path = "../revault_vault_api" }

[dev-dependencies]
revault_migrate_archive_v3 = { path = "../revault_migrate_archive_v3", version = "0.0.8" }
archive_v3 = { package = "revault_archive_v3_reader", path = "../revault_migrate_archive_v3/legacy", version = "0.0.8", features = ["migration", "vault-integration"] }
revault_migrate_vault_v2 = { path = "../revault_migrate_vault_v2" , version = "0.0.38" }
revault_vault_api_v2 = { package = "revault_vault_api", version = "=0.0.10" }
revault_lockbox_api_v2 = { package = "revault_lockbox_api", version = "=0.0.9" }
tempfile = "3"
revault_migrate_vault_v1 = { path = "../revault_migrate_vault_v1" , version = "0.0.41" }
revault_migrate_archive_v1 = { path = "../revault_migrate_archive_v1" , version = "0.0.42" }
revault_vault_api_v1 = { package = "revault_vault_v1_reader", version = "0.0.4", path = "../revault_vault_v1_reader" }
# Path-only test support is omitted from the published package dependencies.
revault_lockbox_api_v1 = { package = "revault_archive_v1_legacy_reader", path = "../revault_archive_v1_legacy_reader" }
revault_lockbox_api_export_v1 = { package = "revault_archive_v1_reader", version = "0.0.4", path = "../revault_archive_v1_reader" }
revault_lockbox_api_vault_v1 = { package = "revault_archive_v1_initial_reader", version = "0.0.4", path = "../revault_archive_v1_initial_reader" }

revault_vault_api_container_v1 = { package = "revault_vault_v2_container_v1_reader", version = "0.0.4", path = "../revault_vault_v2_container_v1_reader" }

vault_v3 = { package = "revault_vault_v3_reader", path = "../revault_migrate_archive_v3/legacy_vault", version = "0.0.8" }
