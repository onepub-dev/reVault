[package]
name = "revault_bindings"
version = "0.2.41"
edition = "2021"
rust-version = "1.88"
license-file = "../revault_lockbox_api/LICENSE"
description = "C ABI and WebAssembly bindings for the reVault APIs"
repository = "https://github.com/onepub-dev/reVault"

[lib]
name = "revault_api"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["native"]
native = []

[dependencies]
revault_lockbox_api = { version = "0.0.59", path = "../revault_lockbox_api", features = ["bindings"] }
revault_vault_api = { version = "0.0.60", path = "../revault_vault_api", features = ["exchange-http"] }
flatbuffers = "=25.12.19"
zeroize = "1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
revault_key_server = { path = "../revault_key_server" , version = "0.0.53" }
tempfile = "3"
criterion = "0.8.2"
zeroize = "1.9"
