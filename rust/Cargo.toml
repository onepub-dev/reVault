[workspace]
members = [
    "revault_page_api",
    "revault_lockbox_api",
    "revault_vault_api",
    "revault_migration_format",
    "revault_migrate_vault_v1",
    "revault_migrate_vault_v2",
    "revault_migrate_archive_v1",
    "revault_migrate_archive_v3",
    "revault_migration",
    "revault_cli",
    "revault_publish_protocol",
    "revault_key_server",
    "revault_bindings",
    "revault_wasm_bindings",
    "revault_tooling",
    "xtask",
]
exclude = ["vendor/zstd-complete"]
resolver = "2"

# CLI integration tests repeatedly derive real password keys. Optimize external
# dependencies without changing KDF parameters or disabling debug assertions.
[profile.test.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Corrected codec is published as zstd-complete 0.3.0. The historical
# vendor snapshot is no longer used to resolve this workspace.
