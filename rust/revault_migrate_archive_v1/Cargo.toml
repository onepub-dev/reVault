[package]
publish = false
name = "revault_migrate_archive_v1"
version = "0.0.42"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "Deprecated: use revault_migrate_v1 for isolated historical migration"
repository = "https://github.com/onepub-dev/reVault"
readme = "README.md"

[[bin]]
name = "revault-migrate-archive-v1"
path = "src/bin/revault-migrate-archive-v1.rs"

[dependencies]
getrandom = "0.4"
revault_migration_format = "=0.0.4"
# Historical readers are deliberately pinned outside the current core API.
revault_lockbox_api_v1 = { package = "revault_archive_v1_reader", version = "0.0.4", path = "../revault_archive_v1_reader", features = ["migration"] }
revault_vault_api = { package = "revault_vault_v2_container_v1_reader", version = "0.0.4", path = "../revault_vault_v2_container_v1_reader" }
sha2 = "0.11"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
