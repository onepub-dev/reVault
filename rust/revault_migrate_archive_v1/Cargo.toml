[package]
name = "revault_migrate_archive_v1"
version = "0.0.4"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "Historical native archive-format-v1 exporter for reVault migrations"
repository = "https://github.com/onepub-dev/reVault"
readme = "README.md"

[[bin]]
name = "revault-migrate-archive-v1"
path = "src/bin/revault-migrate-archive-v1.rs"

[dependencies]
getrandom = "0.4"
revault_migration_format = { version = ">=0.0.1, <0.0.5", path = "../revault_migration_format" }
# Historical readers are deliberately pinned outside the current core API.
revault_lockbox_api_v1 = { package = "revault_lockbox_api", version = "=0.0.3", features = ["migration"] }
revault_vault_api = { version = "=0.0.3" }
sha2 = "0.11"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
