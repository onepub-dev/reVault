[package]
name = "revault_wasm_bindings"
version = "0.0.2"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
revault_lockbox_api = { version = "0.0.6", path = "../revault_lockbox_api", features = ["bindings"] }
