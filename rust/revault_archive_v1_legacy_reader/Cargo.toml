[package]
edition = "2021"
rust-version = "1.88"
name = "revault_archive_v1_legacy_reader"
publish = false
version = "0.0.4"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Deprecated: use revault_migrate_v1 for isolated historical migration"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/onepub-dev/reVault"

[features]
bindings = []
migration = []
native-zstd-encoder = ["dep:zstd"]
vault-integration = []

[lib]
name = "revault_lockbox_api"
path = "src/lib.rs"
test = false
doctest = false

[dependencies.argon2]
version = "0.5"

[dependencies.chacha20poly1305]
version = "0.11"

[dependencies.ed25519-dalek]
version = "2"

[dependencies.getrandom]
version = "0.4"

[dependencies.hkdf]
version = "0.13"

[dependencies.ml-dsa]
version = "0.1"
features = ["getrandom"]

[dependencies.ml-kem]
version = "0.3.2"
features = ["getrandom"]

[dependencies.revault_page_api]
version = "0.0.2"

[dependencies.ruzstd]
version = "0.9.1"

[dependencies.sha2]
version = "0.11"

[dependencies.sysinfo]
version = "0.38.4"
features = ["system"]
default-features = false

[dependencies.unicode-normalization]
version = "0.1"

[dependencies.x25519-dalek]
version = "2"
features = ["static_secrets"]

[dependencies.zeroize]
version = "1.9"

[dependencies.zstd]
version = "0.13.3"
optional = true
default-features = false

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[target."cfg(unix)".dependencies.libc]
version = "0.2"
