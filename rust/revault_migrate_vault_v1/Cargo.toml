[package]
name = "revault_migrate_vault_v1"
version = "0.0.40"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "Historical native vault-format-v1 exporter for reVault migrations"
repository = "https://github.com/onepub-dev/reVault"
readme = "README.md"

[[bin]]
name = "revault-migrate-vault-v1"
path = "src/bin/revault-migrate-vault-v1.rs"

[dependencies]
getrandom = "0.4"
revault_migration_format = "=0.0.4"
revault_vault_api_v1 = { package = "revault_vault_v1_reader", version = "0.0.3", path = "../revault_vault_v1_reader" }
revault_lockbox_api_v1 = { package = "revault_archive_v1_initial_reader", version = "0.0.3", path = "../revault_archive_v1_initial_reader" }
sha2 = "0.11"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
revault_vault_api_container_v1 = { package = "revault_vault_v2_container_v1_reader", version = "0.0.3", path = "../revault_vault_v2_container_v1_reader" }
revault_lockbox_api_container_v1 = { package = "revault_archive_v1_reader", version = "0.0.3", path = "../revault_archive_v1_reader" }
