[package]
name = "revault_lockbox_api"
version = "0.0.41"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "reVault lockbox API to create and manage lockboxes"
repository = "https://github.com/onepub-dev/reVault"
documentation = "https://docs.rs/revault_lockbox_api"
readme = "README.md"

[package.metadata.docs.rs]
features = ["external-source"]

[lib]
name = "revault_lockbox_api"
path = "src/lib.rs"

[features]
default = ["issue303-protocol"]
vault-integration = []
bindings = []
migration = []
test-support = []
external-source = []
# Compatibility feature name: format-v2 is unconditional in the core.
issue303-protocol = []
native-zstd-encoder = ["dep:zstd"]

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
revault_page_api = { version = "0.0.34", path = "../revault_page_api" }
ml-dsa = { version = "0.1", features = ["getrandom"] }
ml-kem = { version = "0.3.2", features = ["getrandom"] }
sha2 = "0.11"
serde_json = "1"
unicode-normalization = "0.1"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1.9"
zstd-complete = { version = "0.2", features = ["c-port-validation"] }
zstd = { version = "0.14.0", default-features = false, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
rayon = "1.12"
criterion = "0.8.2"
oxiarc-zstd = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[[bench]]
name = "performance"
harness = false
test = false

[[bench]]
name = "protection_gate"
harness = false
test = false

[[bench]]
name = "pgp_compare"
harness = false
test = false

[[bench]]
name = "zip_read"
harness = false
test = false

[[bench]]
name = "decoder_workspace"
harness = false
test = false

[[bench]]
name = "block_layout"
harness = false

[[test]]
name = "block_layout_checks"
path = "tests/block_layout_checks.rs"

[[bench]]
name = "compression_corpus"
path = "benches/probes/compression_corpus.rs"
harness = false
test = false
