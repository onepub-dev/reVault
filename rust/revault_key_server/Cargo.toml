[package]
name = "revault_key_server"
version = "0.0.53"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "High-throughput reVault key rendezvous server"
repository = "https://github.com/onepub-dev/reVault"
documentation = "https://docs.rs/revault_key_server"
readme = "README.md"

[lib]
name = "revault_key_server"
path = "src/lib.rs"

[[bin]]
name = "revault_key_server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "query",
    "tokio",
] }
bytes = "1"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
futures-util = "0.3"
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "axum", "tls12", "webpki-roots"] }
clap = { version = "4.6.6", default-features = false, features = [
    "error-context",
    "help",
    "std",
    "usage",
] }
getrandom = "0.4"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "rustls-tls",
] }
revault_publish_protocol = { version = "0.0.53", path = "../revault_publish_protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time", "macros"] }
toml = "1.1"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", features = ["util"] }
revault_lockbox_api = { version = "0.0.59", path = "../revault_lockbox_api" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_EventLog"] }
