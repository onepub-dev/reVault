[package]
name = "revault_approval_protocol"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license-file = "../revault_lockbox_api/LICENSE"
description = "End-to-end encrypted, replay-resistant reVault approval protocol"
repository = "https://github.com/onepub-dev/reVault"

[dependencies]
base64ct = { version = "1", features = ["alloc"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
revault_lockbox_api = { version = "0.0.4", path = "../revault_lockbox_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9"

[dev-dependencies]
sha2 = "0.11"
