[package]
name = "revault_migration_format"
version = "0.0.44"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "Encrypted streaming migration artifact format for reVault"
repository = "https://github.com/onepub-dev/reVault"
readme = "README.md"

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.4"
revault_secure_memory = { version = "0.1.0", path = "../revault_secure_memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
